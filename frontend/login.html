<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | NxtStepGo</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./style/styles.css">

</head>

<body class="bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center min-h-screen px-4">

<div class="w-full max-w-md">
    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl border border-slate-100">
        <div class="flex items-center justify-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded-xl text-white flex items-center justify-center">
                <i data-lucide="login" class="w-6 h-6"></i>
            </div>
        </div>
        
        <h2 class="text-3xl font-bold mb-2 text-center text-slate-900">Welcome Back</h2>
        <p class="text-center text-slate-500 mb-8 text-sm">Sign in to your account to continue</p>

        <form id="loginForm">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input
                    type="email"
                    placeholder="your@email.com"
                    id="email"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input
                    type="password"
                    placeholder="••••••••"
                    id="password"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 hover:shadow-xl hover:-translate-y-1"
            >
                Login
            </button>
        </form>

        <p class="mt-6 text-center text-slate-600">
            Don't have an account?
            <a href="/signup.html" class="text-blue-600 font-bold hover:underline">Sign up</a>
        </p>
        
        <div id="error-message" class="mt-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm hidden"></div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const errorDiv = document.getElementById("error-message");
        errorDiv.classList.add('hidden');

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save user info to localStorage
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.user.name);
                
                alert(data.message || "Login successful");
                window.location.href = "/templates/departments.html";
            } else {
                errorDiv.textContent = data.message || "Login failed";
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
