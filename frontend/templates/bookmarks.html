<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | NxtStepGo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 hero-gradient">
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 bg-white bg-opacity-95 backdrop-blur py-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group text-left brand-logo">
                <div class="brand-icon-wrapper">
                    <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200 brand-icon">
                        <i data-lucide="graduation-cap"></i>
                    </div>
                </div>
                <div class="flex flex-col leading-tight">
                    <span class="brand-text">NxtStepGo</span>
                    <span class="brand-subtitle">Bookmarks</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <a href="departments.html" class="text-slate-600 px-6 py-2.5 rounded-full text-sm font-bold hover:text-blue-600 transition-all">Explore</a>
                <button id="logout-btn" class="text-red-600 px-6 py-2.5 rounded-full text-sm font-bold hover:bg-red-50 transition-all">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-32 px-6 animate-in min-h-screen pt-32">
        <div class="mb-12">
            <h1 class="text-5xl font-black text-slate-900 mb-4">My Bookmarks</h1>
            <p class="text-slate-500 font-medium">All your saved items in one place</p>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-3 mb-12 overflow-x-auto pb-2">
            <button class="filter-btn active px-6 py-2 rounded-full font-bold whitespace-nowrap transition-all" data-type="all">
                <i data-lucide="bookmark" class="w-4 h-4 inline mr-2"></i>All
            </button>
            <button class="filter-btn px-6 py-2 rounded-full font-bold whitespace-nowrap transition-all" data-type="program">
                <i data-lucide="book-open" class="w-4 h-4 inline mr-2"></i>Programs
            </button>
            <button class="filter-btn px-6 py-2 rounded-full font-bold whitespace-nowrap transition-all" data-type="job">
                <i data-lucide="briefcase" class="w-4 h-4 inline mr-2"></i>Jobs
            </button>
            <button class="filter-btn px-6 py-2 rounded-full font-bold whitespace-nowrap transition-all" data-type="exam">
                <i data-lucide="file-text" class="w-4 h-4 inline mr-2"></i>Exams
            </button>
            <button class="filter-btn px-6 py-2 rounded-full font-bold whitespace-nowrap transition-all" data-type="startup">
                <i data-lucide="rocket" class="w-4 h-4 inline mr-2"></i>Startups
            </button>
        </div>

        <!-- Bookmarks Grid -->
        <div id="bookmarksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-20 bg-white rounded-3xl border border-slate-100">
            <i data-lucide="bookmark-off" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
            <p class="text-slate-400 font-medium">No bookmarks yet. Start exploring to save items!</p>
        </div>
    </main>

    <script src="../script/data.js"></script>
    <script>
        lucide.createIcons();

        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = '/login.html';
        }

        let userPreferences = null;
        let currentFilter = 'all';

        // Load user bookmarks
        async function loadBookmarks() {
            try {
                const response = await fetch('/api/preferences', {
                    headers: {
                        'x-user-id': userId
                    }
                });
                if (response.ok) {
                    userPreferences = await response.json();
                    renderBookmarks();
                }
            } catch (error) {
                console.error('Error loading bookmarks:', error);
            }
        }

        // Get all bookmarks
        function getAllBookmarks() {
            const allBookmarks = [];
            if (userPreferences.bookmarkedPrograms) allBookmarks.push(...userPreferences.bookmarkedPrograms);
            if (userPreferences.bookmarkedJobs) allBookmarks.push(...userPreferences.bookmarkedJobs);
            if (userPreferences.bookmarkedExams) allBookmarks.push(...userPreferences.bookmarkedExams);
            if (userPreferences.bookmarkedStartups) allBookmarks.push(...userPreferences.bookmarkedStartups);
            return allBookmarks;
        }

        // Render bookmarks
        function renderBookmarks() {
            const grid = document.getElementById('bookmarksGrid');
            const emptyState = document.getElementById('emptyState');
            
            grid.innerHTML = '';

            let bookmarks = getAllBookmarks();
            
            if (currentFilter !== 'all') {
                bookmarks = bookmarks.filter(b => b.type === currentFilter);
            }

            if (bookmarks.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            bookmarks.forEach((bookmark, index) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-6 rounded-2xl border border-slate-100 hover:shadow-xl transition-all card-hover opacity-0';
                div.style.animation = `fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${0.2 + index * 0.05}s forwards`;
                
                const typeColors = {
                    program: 'bg-blue-50 text-blue-600',
                    job: 'bg-green-50 text-green-600',
                    exam: 'bg-purple-50 text-purple-600',
                    startup: 'bg-orange-50 text-orange-600'
                };

                const typeIcons = {
                    program: 'book-open',
                    job: 'briefcase',
                    exam: 'file-text',
                    startup: 'rocket'
                };

                div.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${typeColors[bookmark.type] || 'bg-slate-100 text-slate-600'}">
                            ${bookmark.type}
                        </span>
                        <button class="p-2 hover:bg-red-50 text-slate-400 hover:text-red-600 transition rounded-lg remove-btn" data-id="${bookmark.elementId}">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-2">${bookmark.title}</h3>
                    <p class="text-slate-500 text-sm flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                        ${bookmark.department}
                    </p>
                    <div class="mt-6 pt-4 border-t border-slate-100">
                        <button class="add-to-collection-btn text-blue-600 font-semibold text-sm hover:text-blue-700" data-id="${bookmark.elementId}" data-title="${bookmark.title}" data-type="${bookmark.type}">
                            <i data-lucide="bookmark-plus" class="w-4 h-4 inline mr-2"></i>
                            Add to Collection
                        </button>
                    </div>
                `;

                div.querySelector('.remove-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await removeBookmark(bookmark.elementId, bookmark.type);
                });

                div.querySelector('.add-to-collection-btn').addEventListener('click', async (e) => {
                    const collectionName = prompt('Enter collection name:');
                    if (collectionName) {
                        await addToCollection(collectionName, bookmark);
                    }
                });

                grid.appendChild(div);
            });

            lucide.createIcons();
        }

        // Remove bookmark
        async function removeBookmark(elementId, type) {
            try {
                const response = await fetch('/api/preferences/remove-bookmark', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': userId
                    },
                    body: JSON.stringify({ elementId, type })
                });

                if (response.ok) {
                    await loadBookmarks();
                }
            } catch (error) {
                console.error('Error removing bookmark:', error);
            }
        }

        // Add to collection
        async function addToCollection(collectionName, bookmark) {
            try {
                const response = await fetch('/api/preferences/collection/add-item', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-id': userId
                    },
                    body: JSON.stringify({
                        collectionName,
                        type: bookmark.type,
                        elementId: bookmark.elementId,
                        title: bookmark.title,
                        department: bookmark.department
                    })
                });

                if (response.ok) {
                    alert('Added to collection!');
                } else {
                    alert('Collection not found. Please create it first.');
                }
            } catch (error) {
                console.error('Error adding to collection:', error);
            }
        }

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-blue-600', 'text-white');
                    b.classList.add('bg-slate-100', 'text-slate-700');
                });
                btn.classList.add('active', 'bg-blue-600', 'text-white');
                btn.classList.remove('bg-slate-100', 'text-slate-700');
                currentFilter = btn.dataset.type;
                renderBookmarks();
            });
        });

        // Initialize active button styling
        document.querySelector('[data-type="all"]').classList.add('bg-blue-600', 'text-white');
        document.querySelectorAll('.filter-btn:not([data-type="all"])').forEach(btn => {
            btn.classList.add('bg-slate-100', 'text-slate-700');
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            window.location.href = '/templates/index.html';
        });

        // Load bookmarks on page load
        loadBookmarks();
        initializePage();
    </script>
</body>
</html>
