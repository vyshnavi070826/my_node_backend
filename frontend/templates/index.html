<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Step | Career Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-blue-600 selection:text-white hero-gradient">
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 bg-transparent py-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group text-left brand-logo">
                <div class="brand-icon-wrapper">
                    <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200 brand-icon">
                        <i data-lucide="graduation-cap"></i>
                    </div>
                </div>
                <div class="flex flex-col leading-tight">
                    <span class="brand-text">NxtStepGo</span>
                    <span class="brand-subtitle">Career Hub</span>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <a href="departments.html" class="bg-blue-600 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="animate-in pt-44 pb-24 px-6 text-center min-h-screen">
        <div class="max-w-5xl mx-auto">
            <div class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest mb-8 border border-blue-100 shadow-sm stagger-1 opacity-0" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;">
                <i data-lucide="zap" class="w-3.5 h-3.5 fill-blue-600 icon-bounce"></i> Career Intelligence Hub
            </div>
            <h1 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tight leading-[1.1] mb-8 text-balance stagger-2 opacity-0" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;">
                Your journey to a better career starts <span class="text-gradient">here.</span>
            </h1>
            <p class="text-xl text-slate-500 font-medium leading-relaxed max-w-3xl mx-auto mb-12 text-balance stagger-3 opacity-0" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;">
                Helping students find the right path after college. Explore higher studies, find the best job roles for your skills, or learn how to start your own business.
            </p>
            <a href="departments.html" class="inline-flex w-full sm:w-auto bg-blue-600 text-white px-10 py-5 rounded-2xl font-black text-lg shadow-2xl shadow-blue-200 hover:bg-blue-700 hover:-translate-y-1 transition-all items-center justify-center gap-3 btn-primary stagger-4 opacity-0" style="animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;">
                Explore Branches <i data-lucide="chevron-right" class="group-hover:translate-x-2 transition-transform"></i>
            </a>
        </div>
    </main>

    <script src="../script/data.js"></script>
    <script>initializePage();</script>
</body>
</html>
