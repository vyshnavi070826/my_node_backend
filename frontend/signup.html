<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | NxtStepGo</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./style/styles.css">

</head>

<body class="bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center min-h-screen px-4">

<!-- Navigation -->
<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 bg-transparent py-6">
    <div class="max-w-7xl mx-auto">
        <a href="index.html" class="flex items-center gap-3 group text-left brand-logo">
            <div class="brand-icon-wrapper">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200 brand-icon">
                    <i data-lucide="user-plus"></i>
                </div>
            </div>
            <div class="flex flex-col leading-tight">
                <span class="brand-text">NxtStepGo</span>
                <span class="brand-subtitle">Register</span>
            </div>
        </a>
    </div>
</nav>

<div class="w-full max-w-md">
    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl border border-slate-100">
        <div class="flex items-center justify-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded-xl text-white flex items-center justify-center">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
        </div>
        
        <h2 class="text-3xl font-bold mb-2 text-center text-slate-900">Create Account</h2>
        <p class="text-center text-slate-500 mb-8 text-sm">Join us and start your career journey</p>

        <form id="signupForm">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                <input
                    type="text"
                    placeholder="John Doe"
                    id="name"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input
                    type="email"
                    placeholder="your@email.com"
                    id="email"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
            </div>

            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input
                    type="password"
                    placeholder="••••••••"
                    id="password"
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    required
                />
                <p class="text-xs text-slate-500 mt-2">Password must be at least 6 characters</p>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 hover:shadow-xl hover:-translate-y-1"
            >
                Sign Up
            </button>
        </form>

        <p class="mt-6 text-center text-slate-600">
            Already have an account?
            <a href="/login.html" class="text-blue-600 font-bold hover:underline">Login</a>
        </p>
        
        <div id="error-message" class="mt-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm hidden"></div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
    lucide.createIcons();

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const errorDiv = document.getElementById("error-message");
        errorDiv.classList.add('hidden');

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/api/auth/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Save user info to localStorage
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.user.name);
                
                alert(data.message || "Account created successfully");
                window.location.href = "/templates/departments.html";
            } else {
                errorDiv.textContent = data.message || "Sign up failed";
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
